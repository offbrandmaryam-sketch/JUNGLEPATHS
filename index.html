<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOUNDARIES IN ACTION - Retro Arcade Edition</title>
    <!-- Retro Arcade Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d0211;
            --panel-bg: #14051a;
            --neon-pink: #ff2a75;
            --neon-cyan: #00f0ff;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --text-color: #00f0ff;
            --border-pink: #ff2a75;
            --border-cyan: #00f0ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'VT323', monospace;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Main Game Cabinet Shell */
        .arcade-container {
            width: 100%;
            max-width: 850px;
            background-color: var(--panel-bg);
            border: 4px solid var(--neon-pink);
            outline: 2px solid var(--neon-cyan);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(255, 42, 117, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.2);
            position: relative;
        }

        /* Arcade Header Title */
        .arcade-title {
            font-family: 'Press Start 2P', monospace;
            text-align: center;
            color: var(--neon-pink);
            font-size: 1.8rem;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .arcade-subtitle {
            font-family: 'Press Start 2P', monospace;
            text-align: center;
            color: var(--neon-cyan);
            font-size: 0.75rem;
            margin-top: 8px;
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        /* HUD Score Bar (Matching Score / Best bar in reference) */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            background: #000;
            border: 2px solid var(--neon-cyan);
            border-radius: 10px;
            padding: 12px 20px;
            margin-bottom: 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.85rem;
        }

        .hud-item {
            color: var(--neon-cyan);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hud-value {
            color: var(--neon-yellow);
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        /* Screen Display Box */
        .screen-box {
            background-color: #000;
            border: 3px solid var(--neon-pink);
            border-radius: 12px;
            padding: 25px;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 0 15px rgba(255, 42, 117, 0.3);
            margin-bottom: 20px;
            position: relative;
        }

        .scene-title {
            font-family: 'Press Start 2P', monospace;
            color: var(--neon-yellow);
            font-size: 1rem;
            margin-bottom: 15px;
            text-shadow: 0 0 5px var(--neon-yellow);
            line-height: 1.4;
        }

        .scene-text {
            font-size: 1.5rem;
            color: #fff;
            line-height: 1.4;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* Retro Arcade Choice Buttons */
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .arcade-btn {
            background: #0d0211;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 14px 18px;
            font-size: 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease-in-out;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .arcade-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--neon-cyan);
            transform: translateY(-2px);
        }

        .arcade-btn-pink {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        .arcade-btn-pink:hover {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 15px var(--neon-pink);
        }

        .btn-tag {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.8rem;
            background: #000;
            color: var(--neon-yellow);
            padding: 4px 8px;
            border: 1px solid var(--neon-yellow);
            border-radius: 4px;
        }

        /* Takeaway Feedback Box */
        .feedback-box {
            background: #14051a;
            border: 2px solid var(--neon-yellow);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            color: #fff;
            font-size: 1.2rem;
            line-height: 1.3;
        }

        .feedback-heading {
            font-family: 'Press Start 2P', monospace;
            color: var(--neon-yellow);
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        /* Top Bar Controls */
        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .helpline-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            background: var(--neon-pink);
            color: #000;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .helpline-btn:hover {
            background: #fff;
        }

        /* Game Over / Victory Modal styling */
        .results-card {
            text-align: center;
        }

        .results-card h2 {
            font-family: 'Press Start 2P', monospace;
            color: var(--neon-green);
            font-size: 1.4rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--neon-green);
        }

        .stat-line {
            font-size: 1.4rem;
            margin: 10px 0;
            color: #fff;
        }
    </style>
</head>
<body>

        <!-- Top Bar with Helpline Exit -->
        <div class="top-controls">
            <span class="arcade-subtitle">GROUP PRESENTATION EDITION</span>
            <a href="https://www.rainn.org/" target="_blank" class="helpline-btn">EMERGENCY HELPLINE</a>
        </div>

        <!-- Arcade Main Title -->
        <h1 class="arcade-title">BOUNDARIES IN ACTION</h1>

        <!-- HUD Scoreboard -->
        <div class="hud-bar">
            <div class="hud-item">STAGE: <span id="stage-num" class="hud-value">1/3</span></div>
            <div class="hud-item">SCORE: <span id="score-val" class="hud-value">0</span></div>
            <div class="hud-item">BEST: <span class="hud-value">300</span></div>
        </div>

        <!-- Central Display Area -->
        <div class="screen-box" id="screen-content">
            <!-- Dynamic Content Injected Here -->
        </div>
    </div>
